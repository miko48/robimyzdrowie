name: Verify public Google Form schema
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions: {}
jobs:
  verify-website-form:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify deployed form and send one clearly marked technical test
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, re, time
          from html.parser import HTMLParser
          class FormParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside=False
                  self.action=None
                  self.method=None
                  self.fields={}
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='form' and a.get('id')=='f':
                      self.inside=True
                      self.action=a.get('action')
                      self.method=a.get('method')
                  if self.inside and tag in ('input','textarea') and a.get('name','').startswith('entry.'):
                      self.fields.setdefault(a['name'],[]).append(a)
              def handle_endtag(self, tag):
                  if tag=='form' and self.inside:
                      self.inside=False
          expected=['entry.1946890973','entry.1326088561','entry.187063823','entry.2005620554','entry.1045781291','entry.1166974658']
          endpoint='https://docs.google.com/forms/d/e/1FAIpQLSei_EjhcbkKBx-u7gDgFMyoe5TiwbjMMMDcOan3R1ve0pB7AA/formResponse'
          site='https://robimyzdrowie.pl/'
          for attempt in range(8):
              try:
                  req=urllib.request.Request(site+'?form-test=20261115',headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=15) as res:
                      html=res.read(6000000).decode('utf-8')
                  parser=FormParser()
                  parser.feed(html)
                  if list(parser.fields)==expected and parser.action==endpoint and parser.method=='post':
                      break
                  print('Waiting for deployment; current fields:',list(parser.fields))
              except Exception as e:
                  print('Deployment fetch:',type(e).__name__,str(e))
              time.sleep(6)
          else:
              raise SystemExit('Updated form not visible on production; no test response sent.')
          print('PRODUCTION_FORM_OK:',list(parser.fields),parser.action,parser.method)
          payload={
              expected[0]:parser.fields[expected[0]][2]['value'],
              expected[1]:parser.fields[expected[1]][0]['value'],
              expected[2]:'TEST TECHNICZNY STRONY – weryfikacja nowego pytania nr 3. Proszę usunąć tę odpowiedź.',
              expected[3]:'TEST TECHNICZNY – NIE KONTAKTOWAĆ',
              expected[4]:'+48 000 000 000',
              expected[5]:parser.fields[expected[5]][0]['value']
          }
          assert re.fullmatch(r'^(\+48[\s-]?)?(\d{3}[\s-]?){2}\d{3}$',payload[expected[4]])
          data=urllib.parse.urlencode(payload).encode('utf-8')
          req=urllib.request.Request(endpoint,data=data,headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/x-www-form-urlencoded','Origin':'https://robimyzdrowie.pl','Referer':site})
          with urllib.request.urlopen(req,timeout=30) as res:
              result=res.read(4000000).decode('utf-8')
              print('GOOGLE_RESPONSE_STATUS:',res.status)
          markers=['twoja odpowiedź została zapisana','twoja odpowiedź została zarejestrowana','your response has been recorded','odpowiedź została zapisana','freebirdFormviewerViewResponseConfirmationMessage','ss-confirmation','vHW8K']
          found=[m for m in markers if m.lower() in result.lower()]
          if not found:
              raise SystemExit('Google response lacks known confirmation marker; test not confirmed. Do not resubmit automatically.')
          print('GOOGLE_CONFIRMATION_OK:',found)
          print('TEST_SUBMISSION_MARKER: TEST TECHNICZNY – NIE KONTAKTOWAĆ')
          PY
