name: Export site backup
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact live main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prepare site files
        run: |
          mkdir -p backup
          cp index.html prywatnosc.html backup/
          cp -R assets backup/
          printf 'Backup date: 2026-11-17\nGitHub commit: %s\nLive website: https://robimyzdrowie.pl/\n\nFiles: index.html, prywatnosc.html, assets/\nTo open locally: extract everything and open index.html.\nThe Google Forms submission requires an internet connection.\n' "$(git rev-parse HEAD)" > backup/README.txt
          find backup -type f -print
      - name: Upload website backup
        uses: actions/upload-artifact@v4
        with:
          name: robimyzdrowie-backup-2026-11-17
          path: backup/
          retention-days: 30
